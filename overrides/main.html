{% extends "base.html" %}

{% block extrahead %}
  <script src="https://unpkg.com/@popperjs/core@2/dist/umd/popper.min.js"></script>
  <script src="https://unpkg.com/tippy.js@6/dist/tippy-bundle.umd.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/animations/scale-subtle.css"/>
  <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/themes/translucent.css"/>
{% endblock %}

{% block content %}
{{ super() }}
<div id="waline" style="margin-top: 80px; padding-top: 12px;"></div>
{% endblock %}

{% block styles %}
{{ super() }}
<link rel="stylesheet" href="https://unpkg.com/@waline/client@latest/dist/waline.css" />
<style>
  .md-grid {
    max-width: 1200px;
  }
</style>
{% endblock %}

{% block scripts %}
{{ super() }}
<script type="module">
  import { init } from 'https://unpkg.com/@waline/client@latest/dist/waline.js';
  init({
    el: '#waline',
    serverURL: "https://lcapi.091209.xyz",
  })
</script>
{% endblock %}
