name: Sync to Gitea
on:
  push:
    branches: [ main ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Gitea mirror sync
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          curl -X POST \
            "https://git.13-trixie.top/api/v1/repos/LinuxCabin/linux-handbook/mirror-sync?token=${{ secrets.GITEA_TOKEN }}"