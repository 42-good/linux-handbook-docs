name: Force Push to Any Remote Repo

on:
  push:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Force push to target repository
        env:
          TARGET_REPO_URL: ${{ secrets.TARGET_REPO_URL }}
        run: |
          git remote add target ${TARGET_REPO_URL}
          git push --force target